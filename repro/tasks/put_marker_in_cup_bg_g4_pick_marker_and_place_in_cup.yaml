# B-pipeline task proposed for put_marker_in_cup_v2, for the G4 splat-prep reconstruction
# put_marker_in_cup_bg_g4 (repro/README.md, chapter 17), whose cup is iter_0 (iter_2 = red marker).
task_name: put_marker_in_cup_bg_g4_pick_marker_and_place_in_cup
og_task_config:
  type: PickPlaceTask
  activity_name: put_marker_in_cup_bg_g4_pick_marker_and_place_in_cup
  semantic_group_mapping:
    marker:
    - iter_2
    cup:
    - iter_0
  init_predicates_all: null
  init_predicates_any: null
  init_predicates_specific: null
  goal_predicates_all:
  - state: InsideAABB
    state_kwargs:
      volume_threshold: 0.5
    value: true
    group: marker
    other_group: cup
  goal_predicates_any: null
  goal_predicates_specific: null
  robot_pose: null
  robot_xyz_randomization: null
  robot_z_rot_randomization: null
  robot_joint_randomization: null
  group_xyz_randomization: null
  group_z_rot_randomization: null
  termination_config:
    max_steps: 500
  reward_config:
    r_potential: 1.0
  include_obs: false
