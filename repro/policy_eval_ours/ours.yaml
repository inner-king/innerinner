# Table G.1's zero-shot rows on scenes our own pipeline reconstructed (repro/README.md, chapter 19).
# Same schema as repro/policy_eval/table_g1.yaml, read by its sample_init_states.py (--spec) and run_table_g1.sh
# (SPEC=...), plus a `build` block per task for build_droid_scene.py.
#
#   template   the authors' DROID desk scene whose robot, sensors, mesh background and ground plane every scene
#              here keeps; its own task objects are dropped. A task may name its own (serve_fruits_ours)
#   build      source: our reconstruction under Data/; objects: <category> -> the source object (`from`), the
#              xy it is moved to, and optionally a template object whose long-axis heading it takes (`align_to`)
#   prompt     paper App. I.2, lower-cased without the final period, as table_g1.yaml writes them
#   timeout_s  the repository's eval config for the task (PutCupInBowl.yaml 60 s, PutMarkerInCup.yaml 90 s);
#              execute_horizon likewise (8)
#   paper      Table G.1's simulation success rate (%) on the authors' scene; paper_real the real-world one
#              (gr00t is GR00T N1.6, run by run_local_gr00t.sh rather than the openpi servers below; dreamzero is
#              DreamZero-DROID, served by DreamZero's own server, policies.dreamzero below)
#   init_states 25 fixed starts, a 5x5 grid per object (paper App. J.1). Grid sizes are the repository's task
#              config ranges (group_xyz_randomization +-r -> 2r), no yaw (its group_z_rot_randomization is 0)
#
# Placement: the cup (Cup in Bowl) and the marker (Marker in Cup), the objects the robot picks, sit where the
# authors' marker sits in the template; the receptacle where the authors' mug sits. The two grids then never
# overlap (nearest centres 29 cm apart against the bowl's 13 cm radius plus the cup's 5 cm).
template: scenes/DROID/droid_desk_put_marker_in_cup/droid_desk_put_marker_in_cup_scene_state_latest.json

tasks:
  cup_in_bowl_ours:
    scene: scenes/DROID/droid_desk_put_cup_in_bowl_ours/droid_desk_put_cup_in_bowl_ours_scene_state_latest.json
    task: ours_cup_in_bowl
    prompt: "pick up the cup, and put the cup inside the bowl"
    timeout_s: 60
    execute_horizon: 8
    paper: {pi0: 56, pi05: 92, gr00t: 40, dreamzero: 92}
    paper_real: {pi0: 88, pi05: 100, gr00t: 68, dreamzero: 100}
    build:
      source: put_cup_in_bowl_v2
      objects:
        white_paper_cup: {from: iter_2, xy: [0.605, -0.189]}
        orange_bowl: {from: iter_0, xy: [0.599, 0.273]}
        black_pen: {from: iter_1, xy: [0.78, 0.05]}
    init_states:
      grid_resolution: [5, 5]
      seed: 42
      randomize_pairings: true
      pairing_anchor_object: null
      objects:
        - {name: white_paper_cup_eqmylj_1, grid_size: [0.25, 0.25], z_rot_range: [0.0, 0.0]}
        - {name: orange_bowl_sfufgv_1, grid_size: [0.10, 0.10], z_rot_range: [0.0, 0.0]}
        - {name: black_pen_wpmeam_1, grid_size: [0.10, 0.10], z_rot_range: [0.0, 0.0]}

  cup_in_bowl_ours_near:
    # Sensitivity check for the layout: the repository's Cup in Bowl config places the bowl right next to the
    # cup (group_predicate_placement, 1-5 cm gaps) and the cup near the robot's centre line, where the main
    # task above keeps them 29 cm or more apart. Here their grid centres are 20 cm apart across the centre line,
    # so neighbouring cells overlap and the sampler's perturbations and swaps keep the starts collision-free.
    scene: scenes/DROID/droid_desk_put_cup_in_bowl_ours_near/droid_desk_put_cup_in_bowl_ours_near_scene_state_latest.json
    task: ours_cup_in_bowl
    prompt: "pick up the cup, and put the cup inside the bowl"
    timeout_s: 60
    execute_horizon: 8
    paper: {pi0: 56, pi05: 92, gr00t: 40, dreamzero: 92}
    paper_real: {pi0: 88, pi05: 100, gr00t: 68, dreamzero: 100}
    build:
      source: put_cup_in_bowl_v2
      objects:
        white_paper_cup: {from: iter_2, xy: [0.55, -0.10]}
        orange_bowl: {from: iter_0, xy: [0.55, 0.10]}
        black_pen: {from: iter_1, xy: [0.78, -0.25]}
    init_states:
      grid_resolution: [5, 5]
      seed: 42
      randomize_pairings: true
      pairing_anchor_object: null
      objects:
        - {name: white_paper_cup_eqmylj_1, grid_size: [0.25, 0.25], z_rot_range: [0.0, 0.0]}
        - {name: orange_bowl_sfufgv_1, grid_size: [0.10, 0.10], z_rot_range: [0.0, 0.0]}
        - {name: black_pen_wpmeam_1, grid_size: [0.10, 0.10], z_rot_range: [0.0, 0.0]}

  marker_in_cup_ours:
    scene: scenes/DROID/droid_desk_put_marker_in_cup_ours/droid_desk_put_marker_in_cup_ours_scene_state_latest.json
    task: ours_marker_in_cup
    prompt: "pick up the marker, and put the marker in the cup"
    timeout_s: 90
    execute_horizon: 8
    paper: {pi0: 40, pi05: 88, gr00t: 28, dreamzero: 80}
    paper_real: {pi0: 40, pi05: 92, gr00t: 28, dreamzero: 88}
    build:
      source: put_marker_in_cup_v2
      objects:
        red_marker: {from: iter_2, xy: [0.605, -0.189], align_to: red_marker_undupl_2}
        white_paper_cup: {from: iter_1, xy: [0.599, 0.273]}
    init_states:
      grid_resolution: [5, 5]
      seed: 42
      randomize_pairings: true
      pairing_anchor_object: null
      objects:
        - {name: red_marker_nvnysj_1, grid_size: [0.25, 0.25], z_rot_range: [0.0, 0.0]}
        - {name: white_paper_cup_owccwy_1, grid_size: [0.10, 0.10], z_rot_range: [0.0, 0.0]}

  # The two tasks above with the masses our stage 11 now gives these objects (Qwen3.5 with the hollow-object
  # note, repro/README.md 20.1) in place of the ones the earlier qwen3-vl run baked into their USDs: cup 70 g,
  # bowl 500 g, pen 10 g; marker 37.6 g, cup 150 g. Real paper cups weigh about 10 g. Everything else is the
  # same, the starts included (a copy of the task's init-state file), so the difference is the masses alone.
  cup_in_bowl_ours_mass:
    scene: scenes/DROID/droid_desk_put_cup_in_bowl_ours_mass/droid_desk_put_cup_in_bowl_ours_mass_scene_state_latest.json
    task: ours_cup_in_bowl
    prompt: "pick up the cup, and put the cup inside the bowl"
    timeout_s: 60
    execute_horizon: 8
    paper: {pi0: 56, pi05: 92, gr00t: 40, dreamzero: 92}
    paper_real: {pi0: 88, pi05: 100, gr00t: 68, dreamzero: 100}
    build:
      source: put_cup_in_bowl_v2
      objects:
        white_paper_cup: {from: iter_2, xy: [0.605, -0.189], mass: 0.010}
        orange_bowl: {from: iter_0, xy: [0.599, 0.273], mass: 0.100}
        black_pen: {from: iter_1, xy: [0.78, 0.05], mass: 0.003}
    init_states:
      grid_resolution: [5, 5]
      seed: 42
      randomize_pairings: true
      pairing_anchor_object: null
      objects:
        - {name: white_paper_cup_eqmylj_1, grid_size: [0.25, 0.25], z_rot_range: [0.0, 0.0]}
        - {name: orange_bowl_sfufgv_1, grid_size: [0.10, 0.10], z_rot_range: [0.0, 0.0]}
        - {name: black_pen_wpmeam_1, grid_size: [0.10, 0.10], z_rot_range: [0.0, 0.0]}

  # cup_in_bowl_ours_mass with the starts drawn the way the repository's task config places the objects
  # (scripts/cfg/task/droid/droid_desk_put_cup_in_bowl.yaml, by sample_task_starts.py), the only description of
  # the authors' Cup in Bowl layout there is: the cup within +-12.5 cm of its scene position and inside the
  # workspace bounds x 0.3..0.8, y -0.05..0.05 m of the robot, the bowl next to it on one of its four sides with a
  # 1-5 cm gap. The cup's scene position is therefore the workspace's centre (robot frame x 0.55, y 0); the bowl's
  # is a placeholder the task overwrites; the pen, a distractor the config only jitters by +-5 cm, is put out of
  # the bowl's way, to the robot's front right.
  cup_in_bowl_ours_cfg:
    scene: scenes/DROID/droid_desk_put_cup_in_bowl_ours_cfg/droid_desk_put_cup_in_bowl_ours_cfg_scene_state_latest.json
    task: ours_cup_in_bowl
    prompt: "pick up the cup, and put the cup inside the bowl"
    timeout_s: 60
    execute_horizon: 8
    paper: {pi0: 56, pi05: 92, gr00t: 40, dreamzero: 92}
    paper_real: {pi0: 88, pi05: 100, gr00t: 68, dreamzero: 100}
    build:
      source: put_cup_in_bowl_v2
      objects:
        white_paper_cup: {from: iter_2, xy: [0.53, 0.0], mass: 0.010}
        orange_bowl: {from: iter_0, xy: [0.53, 0.40], mass: 0.100}
        black_pen: {from: iter_1, xy: [0.45, -0.25], mass: 0.003}
    init_states:
      sampler: task_config
      task_yaml: scripts/cfg/task/droid/droid_desk_put_cup_in_bowl.yaml
      seed: 42
      objects:
        - {name: white_paper_cup_eqmylj_1}
        - {name: orange_bowl_sfufgv_1}
        - {name: black_pen_wpmeam_1}

  marker_in_cup_ours_mass:
    scene: scenes/DROID/droid_desk_put_marker_in_cup_ours_mass/droid_desk_put_marker_in_cup_ours_mass_scene_state_latest.json
    task: ours_marker_in_cup
    prompt: "pick up the marker, and put the marker in the cup"
    timeout_s: 90
    execute_horizon: 8
    paper: {pi0: 40, pi05: 88, gr00t: 28, dreamzero: 80}
    paper_real: {pi0: 40, pi05: 92, gr00t: 28, dreamzero: 88}
    build:
      source: put_marker_in_cup_v2
      objects:
        red_marker: {from: iter_2, xy: [0.605, -0.189], align_to: red_marker_undupl_2, mass: 0.018}
        white_paper_cup: {from: iter_1, xy: [0.599, 0.273], mass: 0.015}
    init_states:
      grid_resolution: [5, 5]
      seed: 42
      randomize_pairings: true
      pairing_anchor_object: null
      objects:
        - {name: red_marker_nvnysj_1, grid_size: [0.25, 0.25], z_rot_range: [0.0, 0.0]}
        - {name: white_paper_cup_owccwy_1, grid_size: [0.10, 0.10], z_rot_range: [0.0, 0.0]}

  # Serve Fruits from our reconstruction of the repository's example video Fruits.mp4 (Data/serve_fruits): the
  # same six objects as the authors' scene droid_desk_serve_fruits, which is the template here. Each of ours
  # takes the authors' category and sits where the authors' object of that category sits; the banana and the
  # two plates also take its heading. Masses are what our stage 11 estimated (README chapter 22). Stage 5
  # also cut out two "green bananas" that the image model had painted over the removed banana; they are left
  # out. Timeout, horizon and the starts' grids follow the authors' scene in repro/policy_eval/table_g1.yaml.
  serve_fruits_ours:
    template: scenes/DROID/droid_desk_serve_fruits/droid_desk_serve_fruits_scene_state_latest.json
    scene: scenes/DROID/droid_desk_serve_fruits_ours/droid_desk_serve_fruits_ours_scene_state_latest.json
    task: ours_serve_fruits
    prompt: "put both the banana and the apple on the green plate"
    timeout_s: 120
    execute_horizon: 24
    paper: {pi0: 4, pi05: 80, gr00t: 20, dreamzero: 12}
    paper_real: {pi0: 0, pi05: 72, gr00t: 4, dreamzero: 8}
    build:
      source: serve_fruits
      objects:
        yellow_pear: {from: iter_0, xy: [0.474, -0.062]}
        yellow_banana: {from: iter_1, xy: [0.483, 0.052], align_to: yellow_banana_yvjcfy_3}
        red_apple: {from: iter_2, xy: [0.666, -0.023]}
        orange_square_plate: {from: iter_4, xy: [0.593, -0.211], align_to: orange_square_plate_rfnrye_1}
        orange_fruit: {from: iter_5, xy: [0.657, 0.135]}
        teal_tray: {from: iter_7, xy: [0.576, 0.282], align_to: teal_tray_tdxtsb_5}
    init_states:
      grid_resolution: [5, 5]
      seed: 42
      randomize_pairings: true
      pairing_anchor_object: teal_tray_kwmamu_1
      objects:
        - {name: yellow_banana_ymuxhn_1, grid_size: [0.15, 0.15], z_rot_range: [-0.174, 0.174]}
        - {name: red_apple_fuegro_1, grid_size: [0.15, 0.15], z_rot_range: [-0.174, 0.174]}
        - {name: teal_tray_kwmamu_1, grid_size: [0.10, 0.10], z_rot_range: [-0.174, 0.174]}
        - {name: yellow_pear_nnhfjs_1, grid_size: [0.25, 0.25], z_rot_range: [-0.174, 0.174]}
        - {name: orange_fruit_riflmn_1, grid_size: [0.33, 0.22], z_rot_range: [-0.174, 0.174]}
        - {name: orange_square_plate_cwrqdt_1, grid_size: [0.10, 0.10], z_rot_range: [-0.174, 0.174]}

  # serve_fruits_ours with each object given the mass of the authors' object of its category (their USDs: banana
  # 120 g, apple 130 g, teal tray 500 g, orange plate 400 g, pear 240 g, orange 140 g) instead of ours (610, 123,
  # 30, 90, 137, 162 g): the masses are where our objects differ most from theirs. Same starts.
  serve_fruits_ours_authmass:
    template: scenes/DROID/droid_desk_serve_fruits/droid_desk_serve_fruits_scene_state_latest.json
    scene: scenes/DROID/droid_desk_serve_fruits_ours_authmass/droid_desk_serve_fruits_ours_authmass_scene_state_latest.json
    task: ours_serve_fruits
    prompt: "put both the banana and the apple on the green plate"
    timeout_s: 120
    execute_horizon: 24
    paper: {pi0: 4, pi05: 80, gr00t: 20, dreamzero: 12}
    paper_real: {pi0: 0, pi05: 72, gr00t: 4, dreamzero: 8}
    build:
      source: serve_fruits
      objects:
        yellow_pear: {from: iter_0, xy: [0.474, -0.062], mass: 0.240}
        yellow_banana: {from: iter_1, xy: [0.483, 0.052], align_to: yellow_banana_yvjcfy_3, mass: 0.120}
        red_apple: {from: iter_2, xy: [0.666, -0.023], mass: 0.130}
        orange_square_plate: {from: iter_4, xy: [0.593, -0.211], align_to: orange_square_plate_rfnrye_1, mass: 0.400}
        orange_fruit: {from: iter_5, xy: [0.657, 0.135], mass: 0.140}
        teal_tray: {from: iter_7, xy: [0.576, 0.282], align_to: teal_tray_tdxtsb_5, mass: 0.500}
    init_states:
      grid_resolution: [5, 5]
      seed: 42
      randomize_pairings: true
      pairing_anchor_object: teal_tray_kwmamu_1
      objects:
        - {name: yellow_banana_ymuxhn_1, grid_size: [0.15, 0.15], z_rot_range: [-0.174, 0.174]}
        - {name: red_apple_fuegro_1, grid_size: [0.15, 0.15], z_rot_range: [-0.174, 0.174]}
        - {name: teal_tray_kwmamu_1, grid_size: [0.10, 0.10], z_rot_range: [-0.174, 0.174]}
        - {name: yellow_pear_nnhfjs_1, grid_size: [0.25, 0.25], z_rot_range: [-0.174, 0.174]}
        - {name: orange_fruit_riflmn_1, grid_size: [0.33, 0.22], z_rot_range: [-0.174, 0.174]}
        - {name: orange_square_plate_cwrqdt_1, grid_size: [0.10, 0.10], z_rot_range: [-0.174, 0.174]}

  # serve_fruits_ours with the authors' orange plate (a distractor) in place of ours. GR00T N1.6 succeeds far more
  # often on our objects than on the authors' (13/25 against 4/25, README chapter 22), and in the authors' scene it
  # keeps going to the orange plate; ours is deeper (4.6 cm against 3.1 cm) and lighter in colour. The starts are
  # ours with the plate's entry taken from the authors' start of the same episode (same grid cells).
  serve_fruits_ours_authplate:
    template: scenes/DROID/droid_desk_serve_fruits/droid_desk_serve_fruits_scene_state_latest.json
    scene: scenes/DROID/droid_desk_serve_fruits_ours_authplate/droid_desk_serve_fruits_ours_authplate_scene_state_latest.json
    task: ours_serve_fruits
    prompt: "put both the banana and the apple on the green plate"
    timeout_s: 120
    execute_horizon: 24
    paper: {pi0: 4, pi05: 80, gr00t: 20, dreamzero: 12}
    paper_real: {pi0: 0, pi05: 72, gr00t: 4, dreamzero: 8}
    build:
      source: serve_fruits
      keep: [orange_square_plate_rfnrye_1]
      objects:
        yellow_pear: {from: iter_0, xy: [0.474, -0.062]}
        yellow_banana: {from: iter_1, xy: [0.483, 0.052], align_to: yellow_banana_yvjcfy_3}
        red_apple: {from: iter_2, xy: [0.666, -0.023]}
        orange_fruit: {from: iter_5, xy: [0.657, 0.135]}
        teal_tray: {from: iter_7, xy: [0.576, 0.282], align_to: teal_tray_tdxtsb_5}
    init_states:
      grid_resolution: [5, 5]
      seed: 42
      randomize_pairings: true
      pairing_anchor_object: teal_tray_kwmamu_1
      objects:
        - {name: yellow_banana_ymuxhn_1, grid_size: [0.15, 0.15], z_rot_range: [-0.174, 0.174]}
        - {name: red_apple_fuegro_1, grid_size: [0.15, 0.15], z_rot_range: [-0.174, 0.174]}
        - {name: teal_tray_kwmamu_1, grid_size: [0.10, 0.10], z_rot_range: [-0.174, 0.174]}
        - {name: yellow_pear_nnhfjs_1, grid_size: [0.25, 0.25], z_rot_range: [-0.174, 0.174]}
        - {name: orange_fruit_riflmn_1, grid_size: [0.33, 0.22], z_rot_range: [-0.174, 0.174]}
        - {name: orange_square_plate_rfnrye_1, grid_size: [0.10, 0.10], z_rot_range: [-0.174, 0.174]}

  # The authors' own Marker in Cup scene with the arm's joint stiffness x4 (arm_kp_scale; README chapter 26): the
  # tuned gains make every joint trail its command by 0.2 s, and the paper says the simulated gains were tuned
  # higher to minimize the tracking error. Same scene and 25 starts as table_g1.yaml's marker_in_cup (copied
  # init-state file), so the difference is the stiffness alone.
  marker_in_cup_kp4:
    scene: scenes/DROID/droid_desk_put_marker_in_cup/droid_desk_put_marker_in_cup_scene_state_latest.json
    task: table_g1_marker_in_cup_kp4
    prompt: "pick up the marker, and put the marker in the cup"
    timeout_s: 90
    execute_horizon: 8
    paper: {pi0: 40, pi05: 88, gr00t: 28, dreamzero: 80}
    paper_real: {pi0: 40, pi05: 92, gr00t: 28, dreamzero: 88}
    init_states:
      grid_resolution: [5, 5]
      seed: 42
      randomize_pairings: true
      pairing_anchor_object: null
      objects:
        - {name: red_marker_undupl_2, grid_size: [0.25, 0.25], z_rot_range: [0.0, 0.0]}
        - {name: cream_mug_bpupsc_1, grid_size: [0.10, 0.10], z_rot_range: [0.0, 0.0]}

policies:
  pi0:
    checkpoint: pi0_droid_jointpos
    config: pi0_droid_jointpos_polaris
    port: 8000
  pi05:
    checkpoint: pi05_droid_jointpos
    config: pi05_droid_jointpos_polaris
    port: 8001
  dreamzero:  # as in repro/policy_eval/table_g1.yaml
    kind: dreamzero
    checkpoint: DreamZero-DROID
    port: 5000
