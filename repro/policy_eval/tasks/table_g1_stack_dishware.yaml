# Table G.1 "Stack Dishware" on the authors' scene droid_desk_stack_dishware (repro/README.md, chapter 18).
# Rubric (paper App. I.2): 1. pick up bowl 2. place bowl on plate 3. pick up cup 4. place cup in bowl.
# Goal and milestones as in scripts/cfg/task/droid_desk_stack_dishware_eval.yaml, without its +-10 deg robot
# joint noise: every episode starts from the same robot pose and a fixed init state (5x5 grid per object, paper
# App. J.1; grids from scripts/cfg/sample_init_states/example.yaml), applied by the eval stage after reset
# (s15_eval.init_states_path).
# The floor is the one thing changed. This scene leaves its droid_v2 background at the background's registered
# pose, whose table top is z = 0 (droid_v2.background.json), and its objects were saved resting at z ~ 0. The
# background has no collider there, so the invisible floor plane is what holds them. The scene's own
# ground_plane_info says -0.02 (the droid_v1 scenes' value, whose background sits 2.5 cm lower), and the
# authors' eval config sets ground_plane_z_offset 0.02, which apply_ground_plane_info takes as the floor's
# height, not as an offset. The first sinks every object 2 cm into the drawn table, the second floats it 2 cm
# above. 0.0 puts the floor where the table is drawn.
task_name: table_g1_stack_dishware
og_task_config:
  type: PickPlaceTask
  activity_name: ${task_name}
  semantic_group_mapping:
    robot: [agent]
    cup: [cream_mug]
    bowl: [blue_bowl]
    plate: [green_plate]
  init_predicates_all: null
  init_predicates_any: null
  init_predicates_specific: null
  goal_predicates_all:
    - state: OnTop
      state_kwargs: null
      value: true
      group: cup
      other_group: bowl
    - state: OnTop
      state_kwargs: null
      value: true
      group: bowl
      other_group: plate
  goal_predicates_any:
    - state: Touching
      state_kwargs: null
      value: false
      group: robot
      other_group: cup
  goal_predicates_specific: null
  milestone_predicates:
    - name: picked_bowl
      state: IsGrasping
      state_kwargs: null
      value: true
      group: robot
      other_group: bowl
      requires: []
    - name: placed_bowl_on_plate
      state: OnTop
      state_kwargs: null
      value: true
      group: bowl
      other_group: plate
      requires: []
    - name: picked_cup
      state: IsGrasping
      state_kwargs: null
      value: true
      group: robot
      other_group: cup
      requires: []
    - name: placed_cup_on_bowl
      state: OnTop
      state_kwargs: null
      value: true
      group: cup
      other_group: bowl
      requires: []
  robot_pose: null
  robot_xyz_randomization: null
  robot_z_rot_randomization: null
  robot_joint_randomization: null
  ground_plane_z_offset: 0.0
  camera_look_at_point: null
  group_init_relative_poses: null
  group_xyz_randomization: null
  group_z_rot_randomization: null
  group_predicate_placement: null
  workspace_bounds: null
  additional_objects: null
  termination_config:
    max_steps: 1000
  reward_config:
    r_potential: 1.0
  include_obs: false
  hdr_background_name: null
